---
- name: Install backend prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - mysql-client
      - build-essential
    state: present
    update_cache: true

- name: Download NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Configure NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major_version }}.x"
    suites: nodistro
    components:
      - main
    signed_by: /etc/apt/keyrings/nodesource.asc
    state: present
    enabled: true

- name: Refresh APT package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    create_home: true
    home: "/home/{{ app_user }}"
    shell: /usr/sbin/nologin
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Checkout EpicBook application
  ansible.builtin.git:
    repo: "{{ app_repository }}"
    version: "{{ app_version }}"
    dest: "{{ app_directory }}"
    update: true
    force: true
  become_user: "{{ app_user }}"

- name: Install Node.js application dependencies
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ app_directory }}"
  become_user: "{{ app_user }}"
  environment:
    NODE_ENV: production
  register: npm_ci
  changed_when: npm_ci.rc == 0

- name: Configure EpicBook environment
  ansible.builtin.template:
    src: epicbook.env.j2
    dest: "{{ app_directory }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  no_log: true

- name: Install EpicBook systemd service
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart EpicBook

- name: Enable and start EpicBook
  ansible.builtin.systemd:
    name: epicbook
    enabled: true
    state: started
    daemon_reload: true
