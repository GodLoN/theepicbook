---
- name: Configure EpicBook backend
  hosts: backend
  become: true
  vars_files:
    - vars/deploy.yml
  roles:
    - common
    - db
    - backend
    - verification

- name: Configure EpicBook frontend
  hosts: frontend
  become: true
  vars_files:
    - vars/deploy.yml
  roles:
    - common
    - frontend
    - verification
